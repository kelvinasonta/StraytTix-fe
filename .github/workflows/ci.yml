name: CI - PR Status Checks

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  validate-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Check PR target branch rule
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          echo "Target branch: $TARGET"
          echo "Source branch: $SOURCE"

          # PRs to main are only allowed from staging
          if [ "$TARGET" = "main" ] && [ "$SOURCE" != "staging" ]; then
            echo "::error::PRs to 'main' are only allowed from 'staging'. Please re-target your PR to 'staging'."
            exit 1
          fi

      - name: Run production build check
        run: npm run build
